<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Live Audio</title>
<link rel="stylesheet" href="style.css"></head>
<body data-theme="amoled" data-perf="balanced">
<div id="intro"><h1 id="i1"></h1><p id="i2"></p></div>
<main id="app" hidden>
<header class="rv"><div class="logo" id="logo"></div><div class="hr"><button id="bSet" class="ib" aria-label="Settings">⚙</button><button id="bConn" class="pill">🔗 Connect</button></div></header>
<section id="cards" class="cards">
 <article class="card rv"><h2>🎵 Song</h2><p>Host Music Live</p><button id="bSong" class="btn">Choose Song</button><input id="file" type="file" accept="audio/*" multiple hidden></article>
 <article class="card rv"><h2>🎙️ Live Mic</h2><p>Turn your phone into a live microphone</p><button id="bMic" class="btn">Start Mic</button></article>
</section>
<section id="live" class="card" hidden>
 <div class="row"><span id="badge" class="tag"></span><span id="cq" class="mut"></span><button id="leave" class="btn sm bad">Leave</button></div>
 <div class="room host-only"><small>LIVE ROOM</small><div id="code"></div><small>Share this code with other devices</small></div>
 <small class="mut">NOW PLAYING</small><h3 id="title">—</h3>
 <input id="seek" type="range" min="0" max="1" step="0.1" value="0"><div class="row"><span id="time" class="mut">0:00 / 0:00</span></div>
 <div class="ctl"><button id="prev" class="rb">⏮</button><button id="play" class="rb big">▶</button><button id="next" class="rb">⏭</button></div>
 <div id="lockP" class="lock" hidden></div><div id="lockS" class="lock" hidden></div>
 <div class="row"><button id="mute" class="ib">🔊</button><input id="vol" type="range" min="0" max="1" step="0.01" value="1"></div>
 <div class="host-only hp"><small class="tag">HOST CONTROLS</small><div id="hstat"></div>
  <label class="row"><span>Allow guest play/pause/skip</span><input id="gAllow" type="checkbox" checked></label>
  <small class="mut">LIVE CONNECTIONS · 👥 <b id="cnt">0</b> Connected</small><div id="peers"></div></div>
</section>
<section class="card viz rv"><div class="row"><select id="vstyle"><option value="bars">Spectrum Bars</option><option value="wave">Waveform</option><option value="circle">Circular Spectrum</option><option value="mirror">Mirror Spectrum</option><option value="particles">Particles</option><option value="rings">Frequency Rings</option></select><button id="fs" class="ib">⛶</button></div><canvas id="cv"></canvas></section>
<footer class="mut rv" id="by"></footer>
</main>
<div class="modal" id="mConn"><div class="sheet"><h3>Connect to Live Room</h3><p class="mut">Enter 6-digit code</p><input id="codeIn" inputmode="numeric" maxlength="6" placeholder="648217" autocomplete="off"><button id="goConn" class="btn">CONNECT</button><button class="btn ghost" data-close>Cancel</button></div></div>
<div class="modal" id="mSet"><div class="sheet"><h3>Settings</h3><div id="setBody"></div><p class="mut" id="about"></p><button class="btn ghost" data-close>Close</button></div></div>
<div class="modal" id="ov"><div class="sheet"><h3 id="ovT"></h3><p id="ovS" class="mut"></p><button id="ovB" class="btn" hidden>OK</button></div></div>
<button id="tap" class="btn" hidden>Tap to Start Audio</button>
<div id="toast"></div>
<script src="app.js"></script></body></html>
