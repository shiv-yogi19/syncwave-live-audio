<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VY VIZORA — See Your Sound.</title><meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css?v=3"></head><body>
<div id="intro"><h1>VY VIZORA</h1><p>See Your Sound.</p><small>Created by Shiv Yogi</small></div>
<header id="top"><div class="row"><b class="logo">VY VIZORA</b>
<button id="btnSettings" class="icon" aria-label="Settings">⚙️</button></div>
<div class="row mics"><button id="btnMain" class="mic" aria-pressed="false">🎙 Main Mic <span>⚪ OFF</span></button>
<button id="btnConn" class="mic">🔗 Connect Mic <span>—</span></button>
<button id="btnFs" class="mic small" aria-label="Fullscreen">⛶</button></div></header>
<div id="hud" aria-hidden="true"><i id="mL"></i><i id="mB"></i><i id="mT"></i><i id="mBt"></i></div>
<main><canvas id="cv"></canvas><div id="wm">Created by Shiv Yogi</div></main>
<footer id="bar"><button id="prev" aria-label="Previous visualizer">‹</button><button id="pick" aria-label="Choose visualizer"><b id="vn"></b></button><button id="rnd" aria-label="Random visualizer">🎲</button><button id="fav" aria-label="Favorite">☆</button><button id="next" aria-label="Next visualizer">›</button></footer>
<section id="sel" hidden><input id="q" type="search" placeholder="Search visualizers…" aria-label="Search"><div id="cats"></div><div id="list"></div></section>
<aside id="settings" hidden><h2>Settings <button id="closeSet" class="icon" aria-label="Close">✕</button></h2>
<label>Visualizer <select id="viz"></select></label>
<label>Color <select id="color"><option>rainbow</option><option>neon</option><option>fire</option><option>ocean</option><option>aurora</option><option>cyber</option><option>purple</option><option>blue</option><option>pink</option><option>gold</option><option>mono</option><option>gradient</option><option>random</option><option>reactive</option></select></label><label>Background <select id="bg"><option value="midnight">Midnight</option><option value="space">Deep Space</option><option value="gradient">Dark Gradient</option><option value="stars">Starfield</option><option value="grid">Dark Grid</option><option value="aurora">Aurora Night</option><option value="cyber">Cyber Dark</option><option value="nebula">Nebula</option><option value="black">Minimal Black</option></select></label><label>Auto mode <select id="am"><option>random</option><option>sequential</option><option>favorites</option><option>category</option></select></label>
<label>Sensitivity <input id="sens" type="range" min="0.5" max="4" step="0.1" value="1.5"></label>
<label>Smoothing <input id="smooth" type="range" min="0" max="0.95" step="0.01" value="0.8"></label>
<label>FFT size <select id="fft"><option>512</option><option selected>2048</option><option>4096</option></select></label>
<label>Main Mic volume <input id="gMain" type="range" min="0" max="2" step="0.05" value="1"></label>
<label>Connected volume <input id="gRem" type="range" min="0" max="2" step="0.05" value="1"></label>
<label>Input device <select id="dev"></select></label>
<label><input id="ns" type="checkbox" checked> Noise suppression</label>
<label><input id="ec" type="checkbox" checked> Echo cancellation</label>
<label><input id="agc" type="checkbox"> Auto gain</label>
<label>🎵 Audio file <input id="file" type="file" accept="audio/*"></label>
<label>Auto-change <select id="auto"><option value="0">Off</option><option>5</option><option>10</option><option>20</option><option>30</option><option>60</option></select></label>
<pre id="mon"></pre></aside>
<div id="modal" hidden><div class="card"><h2>CONNECT MICROPHONE</h2><div id="code">------</div>
<p id="status">Waiting for device…</p><small id="link"></small><br>
<button id="copy">Copy link</button> <button id="cancel">Cancel</button></div></div>
<div id="guest" hidden><div class="card"><h2>Share this phone's mic</h2><p id="gstat">Tap to start. Audio goes peer-to-peer.</p><button id="gstart">🎙 Start sharing</button></div></div>
<script type="module">
// Bootstrap: loads app once; if a module set is stale/mismatched, clear caches and recover automatically (once).
if(!window.__vvLoading){window.__vvLoading=1;
import('./js/app.js?v=3').then(()=>sessionStorage.removeItem('vvRetry')).catch(async e=>{console.error(e);
 if(!sessionStorage.vvRetry){sessionStorage.vvRetry='1';try{for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch{}location.reload()}
 else document.body.insertAdjacentHTML('beforeend','<div class="card" style="position:fixed;top:40%;left:50%;transform:translateX(-50%);z-index:99">VY VIZORA could not load. Check your connection and reload.</div>')})}
</script></body></html>
